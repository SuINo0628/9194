<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>高考倒计时</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    --text-primary:#fff;
    --text-secondary:rgba(255,255,255,0.6);
    --accent:#64ffda;
    --digit-color:#e8f0ff;
    --digit-glow:rgba(160,196,255,0.4);
    --reel-h:110px;
    --reel-w:80px;
    --digit-fs:80px;
  }

  html,body{height:100%;width:100%}

  body{
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:#0a0e27;
    color:var(--text-primary);
    overflow:hidden;
    position:relative;
  }

  /* 背景层 */
  #bg-layer{
    position:fixed;inset:0;
    background:linear-gradient(135deg,#0a0e27 0%,#1a1f3a 50%,#0a0e27 100%);
    background-size:cover;
    background-position:center;
    z-index:0;
    transition:opacity 0.5s;
  }
  #bg-layer::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at center,transparent 0%,rgba(10,14,39,0.7) 100%);
  }

  /* 粒子背景 */
  #particles{position:fixed;inset:0;z-index:1;pointer-events:none}

  /* 主容器 */
  .container{
    position:relative;z-index:2;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:30px;
    padding:20px;
  }

  /* 标题 */
  .title{
    font-size:clamp(24px,5vw,48px);
    font-weight:300;
    letter-spacing:8px;
    text-shadow:0 2px 20px rgba(0,0,0,0.5);
    opacity:0;
    animation:fadeInDown 1s ease 0.2s forwards;
  }
  .subtitle{
    font-size:clamp(12px,2vw,16px);
    color:var(--text-secondary);
    letter-spacing:4px;
    margin-top:8px;
    opacity:0;
    animation:fadeInDown 1s ease 0.4s forwards;
    text-align:center;
  }

  /* 倒计时容器 */
  .countdown{
    display:flex;
    align-items:flex-start;
    gap:clamp(16px,4vw,50px);
    flex-wrap:nowrap;
    justify-content:center;
    opacity:0;
    animation:fadeInUp 1s ease 0.6s forwards;
  }

  /* 单个时间块 */
  .time-block{
    display:flex;flex-direction:column;
    align-items:center;
    position:relative;
  }

  /* 数字组 - 无边框无背景 */
  .digit-group{
    display:flex;
    gap:2px;
    position:relative;
  }

  /* 单个数字滚轮容器 - 关键修复：不用flex居中 */
  .digit-reel{
    width:var(--reel-w);
    height:var(--reel-h);
    overflow:hidden;
    position:relative;
    transition:transform 0.4s ease,filter 0.4s ease;
  }

  /* 上下渐变遮罩 */
  .digit-reel::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;height:30%;
    background:linear-gradient(to bottom,rgba(10,14,39,0.85),transparent);
    z-index:3;pointer-events:none;
  }
  .digit-reel::after{
    content:'';
    position:absolute;
    bottom:0;left:0;right:0;height:30%;
    background:linear-gradient(to top,rgba(10,14,39,0.85),transparent);
    z-index:3;pointer-events:none;
  }

  /* 数字滚动条 - 关键修复：absolute定位，从top:0开始 */
  .digit-strip{
    position:absolute;
    top:0;left:0;right:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform 0.8s cubic-bezier(0.16,1,0.3,1);
    will-change:transform;
  }

  .digit-strip span{
    height:var(--reel-h);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    font-size:var(--digit-fs);
    font-weight:700;
    font-variant-numeric:tabular-nums;
    color:var(--digit-color);
    text-shadow:0 0 30px var(--digit-glow);
    line-height:1;
  }

  /* 标签 */
  .label{
    margin-top:12px;
    font-size:clamp(11px,2vw,14px);
    color:var(--text-secondary);
    letter-spacing:3px;
  }

  /* 冒号分隔符 */
  .separator{
    display:flex;
    align-items:center;
    font-size:calc(var(--digit-fs) * 0.7);
    font-weight:700;
    color:var(--text-secondary);
    opacity:0.35;
    height:var(--reel-h);
  }

  /* 鼠标悬停动效 */
  .time-block:hover .digit-reel{
    transform:translateY(-4px);
    filter:drop-shadow(0 8px 20px rgba(100,255,218,0.2)) brightness(1.15);
  }
  .time-block:hover .digit-strip span{
    color:#fff;
    text-shadow:0 0 40px rgba(100,255,218,0.5);
  }

  /* 悬停光效 */
  .time-block .glow{
    position:absolute;
    width:300px;height:300px;
    background:radial-gradient(circle,rgba(100,255,218,0.08),transparent 70%);
    border-radius:50%;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.4s;
    transform:translate(-50%,-50%);
    top:50%;left:50%;
    z-index:-1;
  }
  .time-block:hover .glow{opacity:1}

  /* 控制栏 */
  .controls{
    display:flex;gap:16px;
    opacity:0;
    animation:fadeInUp 1s ease 0.8s forwards;
  }

  .btn{
    padding:10px 24px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:30px;
    color:var(--text-primary);
    font-size:14px;
    cursor:pointer;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:all 0.3s ease;
    letter-spacing:2px;
  }
  .btn:hover{
    background:rgba(255,255,255,0.15);
    transform:translateY(-2px);
    box-shadow:0 5px 20px rgba(0,0,0,0.3);
  }
  .btn:active{transform:translateY(0) scale(0.97)}

  #file-input{display:none}

  /* 底部信息 */
  .footer{
    position:absolute;
    bottom:20px;left:50%;
    transform:translateX(-50%);
    font-size:12px;
    color:var(--text-secondary);
    letter-spacing:2px;
    opacity:0;
    animation:fadeIn 1s ease 1s forwards;
    text-align:center;
    z-index:2;
    white-space:nowrap;
  }

  /* 动画 */
  @keyframes fadeInDown{
    from{opacity:0;transform:translateY(-30px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes fadeInUp{
    from{opacity:0;transform:translateY(30px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
  }

  /* ============ 手机竖版 ============ */
  @media(max-width:600px) and (orientation:portrait){
    :root{
      --reel-h:62px;
      --reel-w:42px;
      --digit-fs:44px;
    }
    .countdown{gap:6px}
    .separator{font-size:28px}
    .label{font-size:11px;letter-spacing:1px;margin-top:6px}
    .title{letter-spacing:4px;font-size:24px}
    .subtitle{font-size:11px;letter-spacing:2px}
    .container{gap:20px}
    .btn{padding:8px 18px;font-size:12px}
  }

  /* ============ 手机横版 ============ */
  @media(max-height:500px) and (orientation:landscape){
    :root{
      --reel-h:70px;
      --reel-w:50px;
      --digit-fs:52px;
    }
    .countdown{gap:10px}
    .separator{font-size:36px}
    .label{font-size:11px;letter-spacing:2px;margin-top:6px}
    .title{letter-spacing:6px;font-size:26px}
    .subtitle{font-size:11px;letter-spacing:2px;margin-top:4px}
    .container{gap:12px}
    .btn{padding:6px 16px;font-size:12px}
    .footer{bottom:8px;font-size:10px}
  }

  /* ============ 平板 ============ */
  @media(min-width:601px) and (max-width:1024px){
    :root{
      --reel-h:90px;
      --reel-w:65px;
      --digit-fs:64px;
    }
  }
</style>
</head>
<body>

<div id="bg-layer"></div>
<canvas id="particles"></canvas>

<div class="container">
  <div>
    <div class="title">高考倒计时</div>
    <div class="subtitle" id="target-date-text">距离 2029年高考</div>
  </div>

  <div class="countdown" id="countdown">
    <div class="time-block" data-type="days" data-digits="3">
      <div class="glow"></div>
      <div class="digit-group"></div>
      <div class="label">天</div>
    </div>
    <div class="separator">:</div>
    <div class="time-block" data-type="hours" data-digits="2">
      <div class="glow"></div>
      <div class="digit-group"></div>
      <div class="label">时</div>
    </div>
    <div class="separator">:</div>
    <div class="time-block" data-type="minutes" data-digits="2">
      <div class="glow"></div>
      <div class="digit-group"></div>
      <div class="label">分</div>
    </div>
    <div class="separator">:</div>
    <div class="time-block" data-type="seconds" data-digits="2">
      <div class="glow"></div>
      <div class="digit-group"></div>
      <div class="label">秒</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="upload-btn">上传背景</button>
    <button class="btn" id="reset-btn">重置背景</button>
  </div>
</div>

<div class="footer">愿你乘风破浪，金榜题名</div>

<input type="file" id="file-input" accept="image/*">

<script>
  // ===== 倒计时配置 =====
  const TARGET_DATE = new Date('2029-06-07T09:00:00').getTime();
  document.getElementById('target-date-text').textContent = '距离 2029年高考';

  // ===== 创建数字滚轮 =====
  const blocks = document.querySelectorAll('.time-block');
  const reelStates = [];

  blocks.forEach((block, blockIdx) => {
    const numDigits = parseInt(block.dataset.digits);
    const group = block.querySelector('.digit-group');
    const digits = [];

    for (let i = 0; i < numDigits; i++) {
      const reel = document.createElement('div');
      reel.className = 'digit-reel';

      const strip = document.createElement('div');
      strip.className = 'digit-strip';

      // 创建 3 组 0-9，方便向下滚动
      for (let cycle = 0; cycle < 3; cycle++) {
        for (let n = 0; n <= 9; n++) {
          const span = document.createElement('span');
          span.textContent = n;
          strip.appendChild(span);
        }
      }

      reel.appendChild(strip);
      group.appendChild(reel);
      // 从第二组（index 10）开始，确保可以向下滚动
      digits.push({ reel, strip, currentPos: 10, currentDigit: 0 });
    }

    reelStates.push(digits);
  });

  // 获取单个数字高度（从CSS变量读取）
  function getDigitHeight() {
    const h = getComputedStyle(document.documentElement).getPropertyValue('--reel-h');
    return parseFloat(h);
  }

  // 滚动到指定数字（始终向下滚）
  function scrollDigit(reel, newDigit) {
    if (reel.currentDigit === newDigit) return;

    const digitHeight = getDigitHeight();
    const currentCycle = Math.floor(reel.currentPos / 10);
    const currentDigitInCycle = reel.currentPos % 10;

    let targetPos;

    if (newDigit > currentDigitInCycle) {
      // 新数字更大，在同一组的后面，直接滚过去
      targetPos = currentCycle * 10 + newDigit;
    } else {
      // 新数字更小或相等，滚到下一组
      targetPos = (currentCycle + 1) * 10 + newDigit;
    }

    reel.strip.style.transform = `translateY(-${targetPos * digitHeight}px)`;
    reel.currentPos = targetPos;
    reel.currentDigit = newDigit;

    // 如果滚到了第3组（index >= 20），动画结束后静默重置到第2组
    if (targetPos >= 20) {
      setTimeout(() => {
        reel.strip.style.transition = 'none';
        const resetPos = targetPos - 10;
        reel.strip.style.transform = `translateY(-${resetPos * digitHeight}px)`;
        // 强制reflow
        void reel.strip.offsetHeight;
        reel.strip.style.transition = '';
        reel.currentPos = resetPos;
      }, 850);
    }
  }

  // 更新某个块的数字
  function updateBlock(blockIdx, value, numDigits) {
    const padded = String(value).padStart(numDigits, '0');
    const digits = reelStates[blockIdx];

    for (let i = 0; i < numDigits; i++) {
      const digitVal = parseInt(padded[i]);
      scrollDigit(digits[i], digitVal);
    }
  }

  // ===== 倒计时逻辑 =====
  function updateCountdown() {
    const now = Date.now();
    let diff = TARGET_DATE - now;

    if (diff < 0) diff = 0;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    const values = [days, hours, minutes, seconds];
    const digitCounts = [3, 2, 2, 2];

    values.forEach((val, i) => {
      updateBlock(i, val, digitCounts[i]);
    });
  }

  // 初始化：设置到第二组0的位置
  function initReels() {
    const digitHeight = getDigitHeight();
    reelStates.forEach(digits => {
      digits.forEach(reel => {
        reel.strip.style.transition = 'none';
        reel.strip.style.transform = `translateY(-${10 * digitHeight}px)`;
        void reel.strip.offsetHeight;
        reel.strip.style.transition = '';
      });
    });
  }

  // 等DOM渲染后初始化
  requestAnimationFrame(() => {
    initReels();
    setTimeout(updateCountdown, 150);
  });

  // 每秒更新
  setInterval(updateCountdown, 1000);

  // ===== 背景上传 =====
  const uploadBtn = document.getElementById('upload-btn');
  const resetBtn = document.getElementById('reset-btn');
  const fileInput = document.getElementById('file-input');
  const bgLayer = document.getElementById('bg-layer');

  uploadBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        bgLayer.style.background = `url(${event.target.result}) center/cover no-repeat`;
      };
      reader.readAsDataURL(file);
    }
  });

  resetBtn.addEventListener('click', () => {
    bgLayer.style.background = 'linear-gradient(135deg,#0a0e27 0%,#1a1f3a 50%,#0a0e27 100%)';
    bgLayer.style.backgroundSize = 'cover';
    bgLayer.style.backgroundPosition = 'center';
  });

  // ===== 鼠标悬停光效跟随 =====
  document.querySelectorAll('.time-block').forEach(block => {
    const glow = block.querySelector('.glow');
    block.addEventListener('mousemove', (e) => {
      const rect = block.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      glow.style.left = x + 'px';
      glow.style.top = y + 'px';
    });
  });

  // ===== 鼠标视差效果 =====
  let mouseX = 0, mouseY = 0;
  let currentX = 0, currentY = 0;

  document.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  function parallaxLoop() {
    currentX += (mouseX - currentX) * 0.05;
    currentY += (mouseY - currentY) * 0.05;

    const countdown = document.querySelector('.countdown');
    if (countdown) {
      countdown.style.transform = `translate(${currentX * 8}px, ${currentY * 8}px)`;
    }
    requestAnimationFrame(parallaxLoop);
  }
  parallaxLoop();

  // ===== 粒子背景 =====
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let W, H;

  function resizeCanvas() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resizeCanvas();

  window.addEventListener('resize', () => {
    resizeCanvas();
    initParticles();
    initReels();
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      resizeCanvas();
      initParticles();
      initReels();
    }, 200);
  });

  class Particle {
    constructor() {
      this.reset();
      this.y = Math.random() * H;
    }
    reset() {
      this.x = Math.random() * W;
      this.y = H + 10;
      this.size = Math.random() * 2 + 0.5;
      this.speedY = Math.random() * 0.5 + 0.2;
      this.opacity = Math.random() * 0.5 + 0.1;
      this.hue = Math.random() * 60 + 170;
    }
    update() {
      this.y -= this.speedY;
      if (this.y < -10) this.reset();
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${this.opacity})`;
      ctx.fill();
    }
  }

  function initParticles() {
    particles = [];
    const count = Math.min(80, Math.floor(W * H / 15000));
    for (let i = 0; i < count; i++) {
      particles.push(new Particle());
    }
  }
  initParticles();

  function animateParticles() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animateParticles);
  }
  animateParticles();
</script>

</body>
</html>
